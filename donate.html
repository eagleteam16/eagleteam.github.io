        .gallery {

            gap: 20px;

        }
        .gallery img {
            width: 300px;
            height: auto;
            border-radius: 10px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .gallery img:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);

        .button {
            background-color: #2E4A26;
            color: #DFF0D8;
            padding: 12px 24px;
            margin: 10px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            display: inline-block;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        .button::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #3d6b35;
            z-index: -1;
            transition: transform 0.3s ease;
            transform: scaleY(0);
            transform-origin: bottom;
            border-radius: 30px;
        }
        .button:hover::after {
            transform: scaleY(1);
        }
        footer {
