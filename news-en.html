<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest News - Eagle Team</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
    <style>
        body {
            background-color: #111;
            color: white;
        }
        .news-card {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .news-card h2 {
            color: white;
        }
        .news-card p {
            color: rgba(255, 255, 255, 0.8);
        }
        .news-cover-image {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 8px;
            margin: 8px 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .read-more {
            color: #4a8f3c !important;
        }
        .read-more:hover {
            color: #3a752e !important;
        }
        .read-more i {
            color: inherit;
        }
        .read-more-btn {
            background: transparent;
            border: 0;
            padding: 0;
            font: inherit;
            cursor: pointer;
        }
        .news-detail {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }
        .news-detail-title {
            color: #4a8f3c;
            margin-bottom: 10px;
        }
        body.news-modal-open {
            overflow: hidden;
        }
        .news-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
            opacity: 0;
            transition: opacity 220ms ease;
            pointer-events: none;
        }
        .news-modal[hidden] {
            display: none !important;
        }
        .news-modal.is-visible {
            opacity: 1;
            pointer-events: auto;
        }
        .news-modal-panel {
            width: min(1100px, 80vw);
            height: min(82vh, 820px);
            background: #151515;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 26px 24px 22px;
            position: relative;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
            transform: scale(0.92);
            transition: transform 220ms ease;
        }
        .news-modal-panel.is-visible {
            transform: scale(1);
        }
        .news-modal-close {
            position: absolute;
            top: 10px;
            right: 14px;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
        }
        .news-modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .news-modal-title {
            margin-top: 0;
            margin-bottom: 16px;
            color: #4a8f3c;
            padding-right: 40px;
        }
        .news-modal-body p {
            text-align: left;
            max-width: 100%;
            margin: 0 0 14px;
            line-height: 1.8;
        }
        .news-modal-image {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .news-date {
            background-color: #4a8f3c;
        }
        footer {
            background-color: #0a0a0a;
        }
        .footer-content {
            color: white;
        }
        .footer-section p {
            color: rgba(255, 255, 255, 0.8);
        }
        .social-links a {
            color: white;
        }
        .social-links a:hover {
            color: #4a8f3c;
        }
    </style>
</head>
<body data-news-lang="en">
    <!-- Navigation Bar -->
    <nav class="main-nav">
        <div class="nav-container">
            <a href="index-en.html" class="logo">illuminating rainforest</a>
            <div class="nav-links">
                <a href="index-en.html">Home</a>
                <a href="about-en.html">About Us</a>
                <a href="news-en.html" class="active">News</a>
                <a href="donate-en.html" class="donate-btn">Donate</a>
                <div class="language-switcher">
                    <a href="news.html">中文</a>
                    <a href="news-en.html" class="active">EN</a>
                </div>
            </div>
            <button class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <main class="container">
        <h1>Latest News</h1>
        
        <section class="news-section" id="news-list"></section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>Contact Us</h3>
                <p>Email: contact@eagleteam.org</p>
            </div>
            <div class="footer-section">
                <h3>Follow Us</h3>
                <div class="social-links">
                    <a href="#"><i class="fab fa-facebook"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-youtube"></i></a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2024 Eagle Team. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/news.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
